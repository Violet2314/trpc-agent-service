<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>tRPC Agent Service</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 820px; margin: 0 auto; padding: 24px; }
    #messages { min-height: 360px; border: 1px solid #8886; border-radius: 8px; padding: 16px; overflow: auto; }
    .user { color: #5b8cff; margin: 12px 0 4px; }
    .agent { white-space: pre-wrap; margin: 4px 0 12px; }
    .error { color: #d33; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    input, button { padding: 10px; }
    #binding { width: 180px; }
  </style>
</head>
<body>
  <h1>多租户 Agent WebUI</h1>
  <p>Binding：<input id="binding" value="binding-a" autocomplete="off"></p>
  <main id="messages" aria-live="polite"></main>
  <form id="chat">
    <input id="text" placeholder="输入消息" autocomplete="off" required>
    <button type="submit">发送</button>
  </form>
  <script>
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chat");
    const input = document.querySelector("#text");
    const binding = document.querySelector("#binding");
    let source;
    let agentLine;

    function add(className, text) {
      const node = document.createElement("div");
      node.className = className;
      node.textContent = text;
      messages.append(node);
      messages.scrollTop = messages.scrollHeight;
      return node;
    }

    function connect(sessionID) {
      if (source) source.close();
      source = new EventSource(`/channels/webui/${encodeURIComponent(binding.value)}/stream?session=${encodeURIComponent(sessionID)}`);
      source.addEventListener("text_delta", event => {
        const payload = JSON.parse(event.data);
        if (!agentLine) agentLine = add("agent", "");
        agentLine.textContent += payload.text || "";
      });
      source.addEventListener("tool_call", event => {
        const payload = JSON.parse(event.data);
        add("agent", `调用工具：${payload.tool_name}`);
      });
      source.addEventListener("error", event => {
        if (!event.data) return;
        const payload = JSON.parse(event.data);
        add("error", payload.error || "执行失败");
      });
      source.addEventListener("done", () => {
        agentLine = null;
        source.close();
      });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", `你：${text}`);
      agentLine = null;
      const response = await fetch(`/channels/webui/${encodeURIComponent(binding.value)}/messages`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id: crypto.randomUUID(), text})
      });
      const result = await response.json();
      if (!response.ok) {
        add("error", result.error || "发送失败");
        return;
      }
      if (result.session_id) connect(result.session_id);
    });
  </script>
</body>
</html>
